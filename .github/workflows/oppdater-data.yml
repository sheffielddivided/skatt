name: Oppdater data fra SSB

on:
  schedule:
    - cron: "17 6 * * 1"   # hver mandag morgen (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent data
        run: |
          python scripts/build_data.py
          python scripts/build_demografi.py
          python scripts/build_profil.py
          python scripts/build_befolkning.py
          python scripts/build_ulikhet.py
      - name: Commit hvis endret
        run: |
          if git diff --quiet -- data; then
            echo "Ingen endringer i data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Oppdater data fra SSB"
          git push
